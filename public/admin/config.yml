backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Koleksi Cerpen"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Judul Cerpen", name: "title", widget: "string", required: true }
      - { label: "Ringkasan / Summary", name: "summary", widget: "text", required: true }
      - label: "Tanggal Rilis"
        name: "date"
        widget: "datetime"
        date_format: "DD MMMM YYYY"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: false
        required: false
        hint: "Biarkan kosong untuk cerpen baru: tanggal rilis terisi otomatis (WIB) saat pertama kali dipublikasikan. Tanggal cerpen lama tidak berubah saat diedit."
      - { label: "Kategori", name: "categories", widget: "list", default: ["Umum"], required: true }
      - { label: "Sampul Cerpen (Cover)", name: "image", widget: "image", default: "placeholder.png", required: true }
      - { label: "Isi Cerpen", name: "body", widget: "markdown", required: true }
